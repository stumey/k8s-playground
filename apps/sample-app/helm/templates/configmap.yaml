apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "sample-app.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sample-app.labels" . | nindent 4 }}
data:
  index.html: |
    <!DOCTYPE html>
    <html>
    <head>
        <title>Kubernetes Playground</title>
        <style>
            body {
                font-family: Arial, sans-serif;
                display: flex;
                justify-content: center;
                align-items: center;
                height: 100vh;
                margin: 0;
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                color: white;
            }
            .container {
                text-align: center;
            }
            h1 { font-size: 3em; margin-bottom: 0.5em; }
            p { font-size: 1.2em; }
        </style>
    </head>
    <body>
        <div class="container">
            <h1>Kubernetes Playground</h1>
            <p>Your sample application is running!</p>
            <p><small>Powered by Kind and Kubernetes</small></p>
            <p><small>Release: {{ .Release.Name }} | Version: {{ .Chart.AppVersion }}</small></p>
        </div>
    </body>
    </html>
