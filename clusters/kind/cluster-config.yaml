kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: playground

# Multi-node cluster for realistic testing
nodes:
  # Control plane node
  - role: control-plane
    image: kindest/node:v1.31.12
    kubeadmConfigPatches:
    - |
      kind: InitConfiguration
      nodeRegistration:
        kubeletExtraArgs:
          node-labels: "ingress-ready=true"
    extraPortMappings:
    # HTTP
    - containerPort: 80
      hostPort: 80
      protocol: TCP
    # HTTPS
    - containerPort: 443
      hostPort: 443
      protocol: TCP
    # Metrics server
    - containerPort: 10250
      hostPort: 10250
      protocol: TCP

  # Worker nodes for distributed workloads
  - role: worker
    image: kindest/node:v1.31.12
  - role: worker
    image: kindest/node:v1.31.12

# Networking configuration
networking:
  # Disable default CNI to allow testing with different CNI plugins
  disableDefaultCNI: false
  # Pod subnet
  podSubnet: "10.244.0.0/16"
  # Service subnet
  serviceSubnet: "10.96.0.0/12"

# Feature gates for testing new Kubernetes features
# Note: EphemeralContainers and PodSecurity are GA in k8s 1.25+ and enabled by default
# featureGates:

# Runtime configuration
containerdConfigPatches:
- |-
  [plugins."io.containerd.grpc.v1.cri".registry.mirrors."localhost:5000"]
    endpoint = ["http://localhost:5000"]
